services:
  postgres:
    image: postgres:16-alpine
    container_name: portofolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portofolio_dev
    ports:
      - '5432:5432'
    volumes:
      - portofolio_pgdata:/var/lib/postgresql/data

volumes:
  portofolio_pgdata:
